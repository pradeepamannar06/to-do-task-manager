
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>My Task Manager</h1>
        <p class="subtitle">Organize your day, one task at a time.</p>

        <form id="task-form">
            <input type="text" id="task-input"
                   placeholder="Enter a new task..." required>
            <button type="submit">Add Task</button>
        </form>

        <div class="filters">
            <button class="filter active" data-filter="all">All</button>
            <button class="filter" data-filter="pending">Pending</button>
            <button class="filter" data-filter="completed">Completed</button>
        </div>

        <div class="task-summary">
            <span id="task-count">0 tasks</span>
        </div>

        <ul id="task-list"></ul>

        <p id="empty-message">No tasks yet. Add your first task!</p>

        <button id="clear-completed" class="clear-btn">
            Clear Completed
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
